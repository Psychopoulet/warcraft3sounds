services:

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/http-aws.conf:/etc/nginx/http-listen.conf:ro
      - ${CERTS_HOST_DIR:-/opt/warcraft3sounds/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/opt/warcraft3sounds/certbot}:/var/www/certbot:ro

  app-blue:
    image: ${APP_IMAGE}
    volumes:
      - ${SOUNDS_HOST_DIR:-/var/lib/warcraft3sounds/sounds}:/root/warcraft3sounds/sounds:ro

  app-green:
    image: ${APP_IMAGE}
    volumes:
      - ${SOUNDS_HOST_DIR:-/var/lib/warcraft3sounds/sounds}:/root/warcraft3sounds/sounds:ro
