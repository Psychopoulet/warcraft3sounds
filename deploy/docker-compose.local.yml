services:

  nginx:
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/http-local.conf:/etc/nginx/http-listen.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  app-blue:
    volumes:
      - ${DB_HOST_DIR:-./db}:/root/warcraft3sounds/db
      - ${SOUNDS_HOST_DIR:-../public/sounds}:/root/warcraft3sounds/sounds:ro

  app-green:
    volumes:
      - ${DB_HOST_DIR:-./db}:/root/warcraft3sounds/db
      - ${SOUNDS_HOST_DIR:-../public/sounds}:/root/warcraft3sounds/sounds:ro
