name: warcraft3sounds

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: warcraft3sounds-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/runtime:/etc/nginx/runtime:ro
    stop_grace_period: 10s

  app-blue:
    image: warcraft3sounds
    container_name: warcraft3sounds-app-blue
    restart: unless-stopped
    stop_grace_period: 20s
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

  app-green:
    image: warcraft3sounds
    container_name: warcraft3sounds-app-green
    restart: unless-stopped
    stop_grace_period: 20s
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

networks:
  default:
    name: warcraft3sounds-network
