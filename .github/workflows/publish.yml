# Publish / version tagging — structure aligned with tests.yml
# Creates refs/tags/<name> only when that tag is absent on origin (git ls-remote).
# publish-aws runs only when that job actually created and pushed a new tag.

# ══════════════════════════════════════════════════════════════════════════════
# METADATA
# ══════════════════════════════════════════════════════════════════════════════

name: Publish                               # Display name in the GitHub UI
run-name: Publish ${{ github.sha }}         # Dynamic run name
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false                 # Do not abort mid tag/push on rapid merges

# ══════════════════════════════════════════════════════════════════════════════
# WHEN? (Trigger events)
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ master ]                    # After merge (push to master)
  workflow_dispatch:                        # Manual trigger in the UI

# ══════════════════════════════════════════════════════════════════════════════
# SECURITY (Permissions)
# ══════════════════════════════════════════════════════════════════════════════

permissions:
  contents: read                            # Read repository contents (least privilege)

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

env:
  NODE_VERSION: '24'                        # Same as tests.yml; used by setup-node

# ══════════════════════════════════════════════════════════════════════════════
# JOBS (Work units)
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  publish-tag-if-new-version:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write                       # Required to create git tags (refs/tags/*)

    outputs:
      tag_created: ${{ steps.create_version_tag.outputs.tag_created }}

    steps:

      - name: Ensure steps to avoid vulnerabilities
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # curl -s https://api.github.com/repos/step-security/harden-runner/commits/v2.19.3 | jq -r .sha
        with:
          egress-policy: audit

      - name: Setup the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # curl -s https://api.github.com/repos/actions/checkout/commits/v6.0.2 | jq -r .sha
        with:
          fetch-depth: 0                    # gitleaks uses a git rev range (e.g. push before..after); depth 1 often misses those commits
          fetch-tags: true                  # so local checks stay consistent; ls-remote still authoritative

      - name: Scan for secrets leaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # curl -s https://api.github.com/repos/gitleaks/gitleaks-action/commits/v2.3.9 | jq -r .sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup NodeJS v${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # curl -s https://api.github.com/repos/actions/setup-node/commits/v6.4.0 | jq -r .sha
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create version tag if missing on github
        id: create_version_tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${VERSION}" ]; then
            echo "::error::package.json is missing a non-empty \"version\" field"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists on origin — skipping."
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"
          echo "tag_created=true" >> "${GITHUB_OUTPUT}"

  publish-aws:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: publish-tag-if-new-version
    if: needs.publish-tag-if-new-version.outputs.tag_created == 'true'

    environment: aws-production

    permissions:
      contents: read
      id-token: write                       # OIDC to AWS (no long-lived access keys)

    steps:

      - name: Ensure steps to avoid vulnerabilities
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # curl -s https://api.github.com/repos/step-security/harden-runner/commits/v2.19.3 | jq -r .sha
        with:
          egress-policy: audit

      - name: Setup the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # curl -s https://api.github.com/repos/actions/checkout/commits/v6.0.2 | jq -r .sha
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup NodeJS v${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # curl -s https://api.github.com/repos/actions/setup-node/commits/v6.4.0 | jq -r .sha
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # curl -s https://api.github.com/repos/aws-actions/configure-aws-credentials/commits/v5 | jq -r .sha
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # curl -s https://api.github.com/repos/aws-actions/amazon-ecr-login/commits/v2 | jq -r .sha

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${ECR_REGISTRY:?}"
          : "${ECR_REPOSITORY:?}"
          VERSION="$(node -p "require('./package.json').version")"
          bash ./scripts/build-image.sh "${ECR_REGISTRY}/${ECR_REPOSITORY}" "${VERSION}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${VERSION}"

      - name: Deploy on EC2 via SSM
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          : "${ECR_REGISTRY:?}"
          : "${ECR_REPOSITORY:?}"
          : "${AWS_REGION:?}"
          : "${EC2_INSTANCE_ID:?}"
          VERSION="$(node -p "require('./package.json').version")"
          PARAMS="$(jq -n \
            --arg r "${ECR_REGISTRY}" \
            --arg p "${ECR_REPOSITORY}" \
            --arg v "${VERSION}" \
            --arg g "${AWS_REGION}" \
            '{commands:[
              ("export ECR_REGISTRY="+$r),
              ("export ECR_REPOSITORY="+$p),
              ("export VERSION="+$v),
              ("export AWS_REGION="+$g),
              "bash /opt/warcraft3sounds/scripts/publish-remote.sh"
            ]}')"
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "publish-aws ${VERSION}" \
            --parameters "${PARAMS}" \
            --query "Command.CommandId" \
            --output text)"
          aws ssm wait command-executed --command-id "${CMD_ID}" --instance-id "${EC2_INSTANCE_ID}"
          STATUS="$(aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)"
          test "${STATUS}" = "Success"

      - name: Check public HTTPS health
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          : "${PUBLIC_HEALTH_URL:?}"
          curl -fS "${PUBLIC_HEALTH_URL}"
